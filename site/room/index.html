<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HYPNAGOGIC — meditation room</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=3">
<script>(function(){try{localStorage.removeItem('am-theme')}catch(e){}
function clock(){var h=new Date().getHours();return(h>=6&&h<19)?'day':'night'}
function apply(){var ov=null;try{ov=localStorage.getItem('am-theme-override')}catch(e){}
var c=clock();if(ov===c){try{localStorage.removeItem('am-theme-override')}catch(e){}ov=null}
document.documentElement.dataset.theme=ov||c}
apply();addEventListener('storage',function(e){if(e.key==='am-theme-override')apply()});setInterval(apply,60000)
/* 작은 화면 표식 — 폰에서는 필름 바깥이 극장처럼 검다, 낮이든 밤이든.
   첫 페인트 전에 걸어야 로딩 한 장부터 검게 뜬다. room2d.js 의 SMALL 과 같은 잣대 */
if(Math.max(screen.width,screen.height)<1100)document.documentElement.dataset.small='1'})()</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=DM+Mono:wght@300;400;500&amp;family=DM+Sans:wght@300;400;500&amp;display=swap">
<link rel="stylesheet" href="../assets/style.css?v=26">
<style>
  html, body { height: 100%; overflow: hidden; }
  /* 마당 — 4K 스틸의 backdrop 핑크와 한 몸 (렌더 실측 #E6CBC4) */
  body { background: #e6cbc4; }
  [data-theme="night"] body { background: var(--paper); }

  /* 로딩 — 섬이 다 지어질 때까지 한지 한 장 */
  .load { position: fixed; inset: 0; z-index: 5; background: #e6cbc4;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    transition: opacity 0.7s ease, background 0.5s ease; }
  [data-theme="night"] .load { background: var(--paper); }

  /* 폰 — 필름 바깥은 극장처럼 검다. 로딩 한 장도 같은 검정에서 열리고,
     그 위의 글씨는 밤의 것을 빌려 입는다(변수를 여기서 다시 매면 자식이 따라온다) */
  [data-small] body, [data-small] .load { background: #000; }
  [data-small] .load {
    --ink2: #97907E;
    --hair: rgba(229, 223, 208, 0.20);
    --seal: #C94D2F;
  }
  .load.out { opacity: 0; pointer-events: none; }
  .load .l-txt { font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; color: var(--ink2); }
  .load .l-rail { width: 200px; height: 1px; background: var(--hair); }
  .load .l-rail i { display: block; height: 100%; background: var(--seal); transform-origin: left; transform: scaleX(0); }
  .load .l-pct { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--ink2); font-variant-numeric: tabular-nums; }

  /* 폰으로 든 손님에게 거는 한마디 — 방은 넓게 지어졌다고. 한 번 접으면 다시 안 뜬다 */
  .wide[hidden] { display: none; }
  .wide { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.5s ease; }
  .wide.in { opacity: 1; }
  .wide-back { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.74); }
  .wide-card { position: relative; margin: 0 26px; max-width: 320px; padding: 20px 21px 17px;
    display: flex; flex-direction: column; gap: 11px; border-radius: 12px;
    background: var(--s3-raised); border: 1px solid var(--s3-raised-line); }
  .wide-eyebrow { font: 400 9.5px/1 var(--s3-mono); letter-spacing: 0.22em; text-transform: uppercase; color: var(--s3-ink45); }
  .wide-txt { font: 400 12.5px/1.65 var(--s3-mono); color: var(--s3-ink70); }
  .wide-ok { align-self: flex-start; margin-top: 3px; padding: 8px 15px; border-radius: 8px;
    background: none; border: 1px solid var(--s3-line); color: var(--s3-ink70);
    font: 400 10.5px/1 var(--s3-mono); }
</style>
</head>
<body>

<a class="s3-home" href="../">hypnagogic</a>

<div class="scene" aria-label="the room — every object does one thing"></div>

<div class="load" id="amLoad" role="status" aria-label="loading the room">
  <span class="l-txt">opening the room</span>
  <span class="l-rail"><i id="amLoadFill"></i></span>
  <span class="l-pct" id="amLoadPct">0%</span>
</div>
<script>(function(){
  var box=document.getElementById('amLoad'),pct=document.getElementById('amLoadPct'),fill=document.getElementById('amLoadFill');
  var t0=Date.now(),target=5,prog=0,done=false;
  /* 진짜 바이트로 차오른다 — 방을 이루는 것 전부를 끝까지 받는 동안의 비율(am-progress).
     다 받고 첫 프레임까지 디코드되면 am-ready 가 100 을 채운다. 숨 고르기는 없다:
     이 막대가 다 차면 방 안에서 더 받을 것이 남아 있지 않다 */
  addEventListener('am-progress',function(e){target=Math.max(target,4+e.detail*94)});
  addEventListener('am-ready',function(){target=100});
  if(document.documentElement.dataset.amReady)target=100;
  setTimeout(function(){target=100},52000); /* 안전핀 — 회선이 죽어도 마당은 열린다(room2d 천장 45s 뒤) */
  var iv=setInterval(function(){
    prog=Math.min(target,prog+(target-prog)*0.14+0.15);
    pct.textContent=Math.floor(prog)+'%';
    fill.style.transform='scaleX('+(prog/100)+')';
    if(prog>99.4&&target===100&&Date.now()-t0>850&&!done){
      done=true;clearInterval(iv);
      pct.textContent='100%';fill.style.transform='scaleX(1)';
      setTimeout(function(){box.classList.add('out')},200);
      setTimeout(function(){box.remove()},1150);
    }
  },50);
})()</script>

<div class="wide" id="amWide" role="dialog" aria-labelledby="amWideTxt" hidden>
  <div class="wide-back"></div>
  <div class="wide-card">
    <div class="wide-eyebrow">before you come in</div>
    <p class="wide-txt" id="amWideTxt">the room was built wide. on a phone you see it
      through a letterbox — a desktop opens the whole of it.</p>
    <button type="button" class="wide-ok">come in anyway</button>
  </div>
</div>
<script>(function(){
  /* 폰에서만, 그리고 한 번만 — 접은 기억은 브라우저가 들고 있는다 */
  if(document.documentElement.dataset.small!=='1')return;
  try{if(localStorage.getItem('am-wide-notice'))return}catch(e){}
  var box=document.getElementById('amWide'),shown=false;
  function show(){if(shown)return;shown=true;box.hidden=false;
    requestAnimationFrame(function(){box.classList.add('in')})}
  function hide(){box.classList.remove('in');
    setTimeout(function(){box.hidden=true},550);
    try{localStorage.setItem('am-wide-notice','1')}catch(e){}}
  /* 방이 열리고 한 박자 뒤에 — 로딩 한 장과 겹치지 않게. 필름이 끝내 안 풀려도 말은 건넨다 */
  if(document.documentElement.dataset.amReady)setTimeout(show,1400);
  else addEventListener('am-ready',function(){setTimeout(show,1400)},{once:true});
  setTimeout(show,53000);
  box.querySelector('.wide-ok').addEventListener('click',hide);
  box.querySelector('.wide-back').addEventListener('click',hide);
})()</script>

<script src="../assets/ambient.js?v=8"></script>
<script src="../assets/room2d.js?v=26" defer></script>
<script src="../assets/session.js?v=9" defer></script>
<script src="../assets/vendor/supabase-2.js" defer></script>
<script src="../assets/auth.js?v=2" defer></script>
</body>
</html>
