<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- vesica piscis — 두 원의 중심 거리가 반지름과 같다(d = r).
       각 원의 둘레가 상대의 중심을 지나고, 겹친 렌즈의 가로:세로가 √3:1 로 떨어진다.
       전체는 2:3 이라 정사각 캔버스에서 세로를 꽉 채우고 가로는 67% 만 쓴다.
       기하: 여백 2 → 3r + 획 = 96 이 유일한 해다. 획을 바꾸면 r 은 따라 움직인다.
       획 7 — 2x 디스플레이에서 16px 파비콘은 32 물리픽셀로 그려지고,
       거기서 가장 깨끗하다. 6 아래로는 16px 에서 회색으로 뭉개진다. -->
  <style>
    .m { fill: none; stroke: #0a0a0a; stroke-width: 7; }
    @media (prefers-color-scheme: dark) { .m { stroke: #f2f2f2; } }
  </style>
  <g class="m">
    <circle cx="50" cy="35.167" r="29.667"/>
    <circle cx="50" cy="64.833" r="29.667"/>
  </g>
</svg>
