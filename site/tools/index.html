<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hypnagogic — tools</title>
<meta name="description" content="Things I built and still use.">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300;400&amp;display=swap">
<style>
  /* 목록 하나. 문은 각자 알아서 지킨다 — 여긴 아무것도 잠그지 않는다. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --gut: clamp(26px, 8vw, 96px); --dim: rgba(255,255,255,0.42); --line: rgba(255,255,255,0.16); }
  html { height: 100%; }
  body {
    min-height: 100%;
    background: #000; color: #fff;
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: center;
    padding: clamp(96px, 18vh, 160px) var(--gut) clamp(56px, 12vh, 96px);
  }
  .mark { position: fixed; top: clamp(28px, 4.5vh, 46px); left: var(--gut);
    font-size: 15px; font-weight: 300; letter-spacing: 0.26em; color: #fff; text-decoration: none; }
  h1 { font-size: clamp(2.1rem, 7.4vw, 6rem); font-weight: 200; line-height: 1.16;
    letter-spacing: 0.005em; text-transform: uppercase; }

  ul { list-style: none; margin-top: clamp(2em, 6vh, 3.4em); max-width: 760px; }
  li { border-top: 1px solid var(--line); }
  li:last-child { border-bottom: 1px solid var(--line); }

  a.item {
    display: flex; align-items: baseline; gap: clamp(12px, 3vw, 28px); flex-wrap: wrap;
    padding: clamp(16px, 2.6vh, 24px) 0;
    color: #fff; text-decoration: none;
    transition: padding-left .25s ease, color .25s ease;
  }
  a.item:hover { padding-left: 12px; }
  a.item:hover .name { color: #fff; }
  a.item:hover .arrow { opacity: 1; transform: translateX(0); }

  .name { font-size: clamp(1.25rem, 3.6vw, 2.1rem); font-weight: 300; letter-spacing: 0.01em;
    color: rgba(255,255,255,0.88); transition: color .25s ease; }
  .desc { flex: 1 1 16em; font-size: 13px; font-weight: 300; letter-spacing: 0.08em;
    color: var(--dim); }
  .tag { font-size: 10px; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  .arrow { font-size: 15px; color: var(--dim); opacity: 0; transform: translateX(-6px);
    transition: opacity .25s ease, transform .25s ease; }
  @media (hover: none) { .arrow { opacity: 1; transform: none; } }
</style>
</head>
<body>
<a class="mark" href="/">HYPNAGOGIC</a>

<h1>Tools</h1>

<ul>
  <li>
    <a class="item" href="/tools/foodiemap/">
      <span class="name">foodie map</span>
      <span class="desc">28,000 restaurants from the shows and guides we actually watch</span>
      <span class="tag">invite only</span>
      <span class="arrow">&rarr;</span>
    </a>
  </li>
  <li>
    <a class="item" href="https://ridgelinehk.com" rel="noopener">
      <span class="name">Ridgeline</span>
      <span class="desc">Hong Kong&rsquo;s hiking trail map &mdash; 9,000+ routes</span>
      <span class="arrow">&rarr;</span>
    </a>
  </li>
  <li>
    <a class="item" href="https://esperfinance.com" rel="noopener">
      <span class="name">Esper</span>
      <span class="desc">Honestly simple personal finance</span>
      <span class="arrow">&rarr;</span>
    </a>
  </li>
  <li>
    <a class="item" href="https://analytics.thousandlab.duckdns.org" rel="noopener">
      <span class="name">web analytics</span>
      <span class="desc">Privacy-first, self-hosted</span>
      <span class="arrow">&rarr;</span>
    </a>
  </li>
</ul>
</body>
</html>
