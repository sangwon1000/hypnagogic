<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HYPNAGOGIC — tools</title>
<meta name="description" content="Things I built and still use.">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=3">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300;400&amp;display=swap">
<style>
  /* 목록 하나. 문은 각자 알아서 지킨다 — 여긴 아무것도 잠그지 않는다. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --gut: clamp(26px, 8vw, 96px); --dim: rgba(255,255,255,0.42); --line: rgba(255,255,255,0.16); }
  html { height: 100%; }
  body {
    min-height: 100%;
    background: #000; color: #fff;
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: center;
    padding: clamp(96px, 18vh, 160px) var(--gut) clamp(56px, 12vh, 96px);
  }
  .mark { position: fixed; top: clamp(28px, 4.5vh, 46px); left: var(--gut);
    font-size: 15px; font-weight: 300; letter-spacing: 0.26em; text-transform: uppercase;
    color: #fff; text-decoration: none; }
  h1 { font-size: clamp(2.1rem, 7.4vw, 6rem); font-weight: 200; line-height: 1.16;
    letter-spacing: 0.005em; text-transform: uppercase; }

  ul { list-style: none; margin-top: clamp(2em, 6vh, 3.4em); }

  /* 줄 사이에 선이 없으므로 이름을 늘려 태그와 화살표를 오른쪽 끝까지 밀면
     그 사이가 허공이 된다. 행을 내용 폭에 맞춰 왼쪽으로 모아 붙여 둔다. */
  a.item {
    display: grid;
    grid-template-columns: auto auto auto;
    align-items: baseline;
    column-gap: clamp(12px, 3vw, 24px);
    width: max-content; max-width: 100%;
    padding: clamp(10px, 1.6vh, 16px) 0;
    color: #fff; text-decoration: none;
    transition: padding-left .25s ease, color .25s ease;
  }
  a.item:hover { padding-left: 12px; }
  a.item:hover .name { color: #fff; }
  a.item:hover .arrow { opacity: 1; transform: translateX(0); }

  .name { font-size: clamp(1.25rem, 3.6vw, 2.1rem); font-weight: 300; letter-spacing: 0.01em;
    color: rgba(255,255,255,0.88); transition: color .25s ease; }
  .tag { font-size: 10px; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  .arrow { font-size: 15px; color: var(--dim); opacity: 0; transform: translateX(-6px);
    transition: opacity .25s ease, transform .25s ease; }
  @media (hover: none) { .arrow { opacity: 1; transform: none; } }
</style>
</head>
<body>
<a class="mark" href="/">hypnagogic</a>

<h1>Tools</h1>

<ul>
  <li>
    <a class="item" href="/tools/foodiemap/">
      <span class="name">foodie map</span>
      <span class="tag">invite only</span>
      <span class="arrow">&rarr;</span>
    </a>
  </li>
</ul>
</body>
</html>
