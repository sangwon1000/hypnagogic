<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hypnagogic — tools</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300&amp;display=swap">
<style>
  /* 아직 빈 방 — 현관과 같은 검정, 같은 여백. 도구가 들어오면 여기에 목록이 선다. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --gut: clamp(26px, 8vw, 96px); }
  html, body { height: 100%; }
  body {
    background: #000; color: #fff;
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: center;
    padding-left: var(--gut); overflow: hidden;
  }
  .mark { position: fixed; top: clamp(28px, 4.5vh, 46px); left: var(--gut);
    font-size: 15px; font-weight: 300; letter-spacing: 0.26em; color: #fff; text-decoration: none; }
  h1 { font-size: clamp(2.1rem, 7.4vw, 6rem); font-weight: 200; line-height: 1.16;
    letter-spacing: 0.005em; text-transform: uppercase; }
  p { margin-top: 1.6em; font-size: 14px; font-weight: 300; letter-spacing: 0.14em;
    text-transform: uppercase; color: rgba(255, 255, 255, 0.42); }
</style>
</head>
<body>
<a class="mark" href="/">HYPNAGOGIC</a>
<h1>Tools</h1>
