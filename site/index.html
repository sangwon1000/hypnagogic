<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hypnagogic</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300&amp;display=swap">
<style>
  /* 현관 — 검은 방 하나에 문 두 개. 여기는 테마가 없다, 밤뿐이다. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #000;
    color: #fff;
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }

  .mark {
    position: fixed;
    top: clamp(28px, 4.5vh, 46px);
    left: var(--gut);
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 0.26em;
    color: #fff;
    text-decoration: none;
  }

  :root { --gut: clamp(26px, 8vw, 96px); }

  nav { padding-left: var(--gut); }

  nav a {
    display: block;
    width: max-content;
    max-width: 100%;
    font-size: clamp(2.1rem, 7.4vw, 6rem);
    font-weight: 200;
    line-height: 1.16;
    letter-spacing: 0.005em;
    text-transform: uppercase;
    color: #fff;
    text-decoration: none;
    transition: opacity 0.45s ease, transform 0.45s ease;
  }

  /* 하나에 손을 얹으면 나머지는 물러선다 */
  nav:hover a { opacity: 0.3; }
  nav a:hover { opacity: 1; transform: translateX(0.14em); }

  nav a:focus-visible { opacity: 1; outline: 1px solid #fff; outline-offset: 10px; }

  @media (prefers-reduced-motion: reduce) {
    nav a { transition: opacity 0.45s ease; }
    nav a:hover { transform: none; }
  }
</style>
</head>
<body>

<a class="mark" href="/">HYPNAGOGIC</a>

<nav>
  <a href="room/">Meditation Room</a>
  <a href="tools/">Tools</a>
</nav>

</body>
</html>
