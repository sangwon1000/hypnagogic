# hypnagogic.xyz — 정적 방 하나. Range(비디오 시킹)는 nginx 기본기라 따로 없다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # html 은 항상 재검증 — ?v= 캐시버스터의 출발점이라 여기가 낡으면 전부 낡는다
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ =404;
    }
    # 필름·스크립트는 ?v= 태그로 갱신하니 길게 물어도 된다
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
    }
}
